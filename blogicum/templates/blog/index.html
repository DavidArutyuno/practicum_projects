{% extends "base.html" %}
{% block title %}
    Лента записей
{% endblock %}
{% block content %}
{% load static %}
<div class="container py-5">
    <h1>Лента записей</h1>                        
    {% for post in posts|dictsortreversed:"id" %}
    <hr>
    <article>
      {% include "includes/article_ul.html" %}
      <p>
        {{ post.text|truncatewords:10 }}
      </p>
      <a href="{% url 'blog:post_detail' post.id %}">Читать полный текст</a>      
    </article>
    {% endfor %}
{% endblock %}
