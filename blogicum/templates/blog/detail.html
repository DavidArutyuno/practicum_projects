{% extends "base.html" %}
{% block title %}
  <title>{{ post.location }}. {{ post.date }}</title>
{% endblock %}
{% block content %}
{% load static %}
<div class="container py-5">
  <article>
    <ul>
      <li>
        Место: {{ post.location }}              
      </li>
      <li>
        Дата: {{ post.date }}
      </li>
      <li>
        Категория:  category_posts index
        <a href="{% url 'blog:category_posts' post.category %}">{{ post.category }}</a> 
      </li>
    </ul>         
    <p>
      {{ post.text|linebreaksbr }}
    </p>          
  </article>                
</div>
{% endblock %}
